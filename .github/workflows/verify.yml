name: Verify Smart Fashion

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check AI backend and Vercel function
        run: >-
          npx --yes --package typescript@7.0.2 tsc
          --noEmit
          --skipLibCheck
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          --lib ES2022,DOM
          convex/aiStylist.ts
          api/ai-stylist.ts

      - name: Build storefront
        run: pnpm build
