name: Deploy Convex backend

on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/convex-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - id: check-key
        name: Check Convex deployment configuration
        shell: bash
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add the CONVEX_DEPLOY_KEY repository secret to enable automatic Convex deployment."
          fi
      - uses: actions/checkout@v4
        if: steps.check-key.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check-key.outputs.enabled == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.check-key.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.check-key.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy Convex functions and schema
        if: steps.check-key.outputs.enabled == 'true'
        run: pnpm exec convex deploy --yes
