name: Deploy Convex backend

on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/convex-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain required deployment secret
        if: ${{ secrets.CONVEX_DEPLOY_KEY == '' }}
        run: echo "::warning::Set the CONVEX_DEPLOY_KEY repository secret to enable automatic Convex deployment."
      - uses: actions/checkout@v4
        if: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
      - uses: pnpm/action-setup@v4
        if: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
        run: pnpm install --frozen-lockfile
      - name: Deploy Convex functions and schema
        if: ${{ secrets.CONVEX_DEPLOY_KEY != '' }}
        run: pnpm exec convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
