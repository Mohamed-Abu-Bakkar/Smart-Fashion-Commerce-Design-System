
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Smart Fashion Commerce Design System</title>
      <meta name="description" content="Experience a premium AI-powered mobile shopping platform that personalizes fashion choices, offers intelligent bargaining, and connects users with community-driven trends." />
      <meta name="robots" content="noindex, nofollow" />
      <meta name="color-scheme" content="light dark" />
      <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
      <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="SF Commerce" />
      <link rel="icon" type="image/png" sizes="16x16" href="/icons/ios/16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/icons/ios/32.png" />
      <link rel="icon" type="image/png" sizes="192x192" href="/icons/android/launchericon-192x192.png" />
      <link rel="apple-touch-icon" href="/icons/ios/180.png" />
      <meta name="msapplication-TileColor" content="#7B61FF" />
      <meta name="msapplication-TileImage" content="/icons/windows/Square150x150Logo.scale-100.png" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; } html { background: #FAF7F2; } html.dark { background: #0d0d0d; }</style>
      <script>
        try {
          var t = localStorage.getItem("sf-theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
